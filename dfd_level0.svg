<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" font-family="Arial, sans-serif" font-size="13">
  <rect width="1000" height="620" fill="#f8fafc" rx="10"/>

  <!-- Title -->
  <text x="500" y="38" text-anchor="middle" font-size="22" font-weight="bold" fill="#1e293b">E-Auction System — Level 0 DFD (Context Diagram)</text>

  <!-- ===== Central Process ===== -->
  <ellipse cx="500" cy="310" rx="130" ry="80" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="3"/>
  <text x="500" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">E-Auction</text>
  <text x="500" y="320" text-anchor="middle" font-size="15" font-weight="bold" fill="#1e3a8a">System</text>
  <text x="500" y="338" text-anchor="middle" font-size="12" fill="#1e40af">Process 0</text>

  <!-- ===== External Entities ===== -->

  <!-- User (Seller/Bidder) - LEFT -->
  <rect x="30" y="270" width="150" height="80" fill="#dcfce7" stroke="#15803d" stroke-width="2" rx="6"/>
  <text x="105" y="302" text-anchor="middle" font-size="13" font-weight="bold" fill="#14532d">User</text>
  <text x="105" y="320" text-anchor="middle" font-size="11" fill="#166534">(Seller / Bidder)</text>

  <!-- Admin - TOP -->
  <rect x="425" y="60" width="150" height="80" fill="#fce7f3" stroke="#be185d" stroke-width="2" rx="6"/>
  <text x="500" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#831843">Admin</text>

  <!-- Database - RIGHT -->
  <!-- cylinder shape via rect + ellipses -->
  <rect x="820" y="276" width="150" height="68" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <ellipse cx="895" cy="276" rx="75" ry="18" fill="#ddd6fe" stroke="#6d28d9" stroke-width="2"/>
  <ellipse cx="895" cy="344" rx="75" ry="18" fill="#ede9fe" stroke="#6d28d9" stroke-width="2"/>
  <text x="895" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#4c1d95">Database</text>

  <!-- Buyer (winner notification) - BOTTOM -->
  <rect x="425" y="490" width="150" height="80" fill="#fef9c3" stroke="#a16207" stroke-width="2" rx="6"/>
  <text x="500" y="522" text-anchor="middle" font-size="13" font-weight="bold" fill="#713f12">Buyer</text>
  <text x="500" y="540" text-anchor="middle" font-size="11" fill="#854d0e">(Winning Bidder)</text>

  <!-- ===== DATA FLOWS ===== -->

  <!-- User → System: Register / Login / List Item / Place Bid -->
  <line x1="180" y1="310" x2="370" y2="310" stroke="#15803d" stroke-width="2" marker-end="url(#arrow-green)"/>
  <rect x="184" y="284" width="170" height="22" fill="white" fill-opacity="0.85"/>
  <text x="270" y="299" text-anchor="middle" font-size="11" fill="#14532d">Register / Login / List Item / Bid</text>

  <!-- System → User: Bid Confirmation / Item Status -->
  <line x1="370" y1="330" x2="180" y2="330" stroke="#059669" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <rect x="184" y="332" width="170" height="22" fill="white" fill-opacity="0.85"/>
  <text x="270" y="347" text-anchor="middle" font-size="11" fill="#065f46">Bid Confirmation / Item Status</text>

  <!-- Admin → System: Login / Manage -->
  <line x1="500" y1="140" x2="500" y2="230" stroke="#be185d" stroke-width="2" marker-end="url(#arrow-pink)"/>
  <rect x="510" y="166" width="140" height="22" fill="white" fill-opacity="0.85"/>
  <text x="582" y="181" text-anchor="middle" font-size="11" fill="#831843">Admin Login / Manage Items</text>

  <!-- System → Admin: Reports / Dashboard -->
  <line x1="480" y1="230" x2="480" y2="140" stroke="#db2777" stroke-width="2" marker-end="url(#arrow-pink2)"/>
  <rect x="308" y="166" width="160" height="22" fill="white" fill-opacity="0.85"/>
  <text x="390" y="181" text-anchor="middle" font-size="11" fill="#9d174d">Reports / Dashboard Data</text>

  <!-- System → Database: Store/Retrieve data -->
  <line x1="630" y1="295" x2="820" y2="295" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <rect x="638" y="268" width="170" height="22" fill="white" fill-opacity="0.85"/>
  <text x="723" y="283" text-anchor="middle" font-size="11" fill="#4c1d95">Store Users / Items / Bids</text>

  <!-- Database → System: Retrieve data -->
  <line x1="820" y1="318" x2="630" y2="318" stroke="#6d28d9" stroke-width="2" marker-end="url(#arrow-purple2)"/>
  <rect x="638" y="322" width="170" height="22" fill="white" fill-opacity="0.85"/>
  <text x="723" y="337" text-anchor="middle" font-size="11" fill="#5b21b6">Retrieve Records / Results</text>

  <!-- System → Buyer: Auction Result / Winner Notification -->
  <line x1="500" y1="390" x2="500" y2="490" stroke="#a16207" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <rect x="510" y="416" width="160" height="22" fill="white" fill-opacity="0.85"/>
  <text x="592" y="431" text-anchor="middle" font-size="11" fill="#713f12">Auction Result / Winner Info</text>

  <!-- Arrow markers -->
  <defs>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#15803d"/>
    </marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#059669"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#be185d"/>
    </marker>
    <marker id="arrow-pink2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#db2777"/>
    </marker>
    <marker id="arrow-purple" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-purple2" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6d28d9"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a16207"/>
    </marker>
  </defs>

  <!-- Legend -->
  <rect x="30" y="530" width="560" height="70" fill="white" stroke="#cbd5e1" stroke-width="1" rx="4"/>
  <text x="45" y="552" font-size="12" font-weight="bold" fill="#334155">Legend:</text>
  <rect x="110" y="540" width="22" height="16" fill="#dcfce7" stroke="#15803d"/>
  <text x="136" y="552" font-size="11" fill="#334155">External Entity</text>
  <ellipse cx="250" cy="548" rx="28" ry="12" fill="#bfdbfe" stroke="#1d4ed8"/>
  <text x="284" y="552" font-size="11" fill="#334155">Process</text>
  <rect x="360" y="540" width="40" height="16" fill="#ede9fe" stroke="#6d28d9"/>
  <text x="406" y="552" font-size="11" fill="#334155">Data Store</text>
  <line x1="110" y1="572" x2="150" y2="572" stroke="#374151" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="158" y="576" font-size="11" fill="#334155">Data Flow (arrow = direction of data movement)</text>
</svg>
