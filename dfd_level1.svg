<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="980" font-family="Arial, sans-serif" font-size="12">
  <rect width="1100" height="980" fill="white"/>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0,8 3,0 6" fill="#333"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="550" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#111" text-decoration="underline">E-Auction System — Level 1 DFD</text>

  <!-- ================================================================
       MODULE 1: SELLER MODULE   (top-left)
  ================================================================ -->
  <rect x="30" y="60" width="470" height="260" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="265" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#15803d">SELLER MODULE</text>

  <!-- External: Seller -->
  <rect x="52" y="110" width="90" height="44" rx="5" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="97" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">SELLER</text>

  <!-- P1.1: Register / Login -->
  <ellipse cx="260" cy="132" rx="80" ry="34" fill="white" stroke="#16a34a" stroke-width="1.8"/>
  <text x="260" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">P1.1: Register</text>
  <text x="260" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">/ Login</text>

  <!-- P1.2: List Item -->
  <ellipse cx="430" cy="132" rx="80" ry="34" fill="white" stroke="#16a34a" stroke-width="1.8"/>
  <text x="430" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">P1.2: List Item</text>
  <text x="430" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">for Auction</text>

  <!-- DS1: Users (seller module) -->
  <rect x="52" y="230" width="130" height="28" fill="white" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="52" y1="230" x2="52" y2="258" stroke="#16a34a" stroke-width="2"/>
  <text x="117" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">DS1: Users</text>

  <!-- DS2: Items -->
  <rect x="330" y="230" width="130" height="28" fill="white" stroke="#16a34a" stroke-width="1.5"/>
  <line x1="330" y1="230" x2="330" y2="258" stroke="#16a34a" stroke-width="2"/>
  <text x="395" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#166534">DS2: Items</text>

  <!-- FLOWS: Seller module -->
  <!-- Seller → P1.1 -->
  <line x1="142" y1="132" x2="180" y2="132" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="161" y="125" text-anchor="middle" font-size="9" fill="#333">Credentials</text>

  <!-- P1.1 → DS1 -->
  <line x1="220" y1="158" x2="140" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="158" y="200" text-anchor="middle" font-size="9" fill="#333">Save User</text>

  <!-- P1.1 → P1.2 -->
  <line x1="340" y1="132" x2="350" y2="132" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="344" y="124" text-anchor="middle" font-size="9" fill="#333">Auth</text>

  <!-- Seller → P1.2 (item details) -->
  <line x1="142" y1="145" x2="300" y2="210" stroke="#333" stroke-width="1.5"/>
  <line x1="300" y1="210" x2="370" y2="162" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="225" y="210" text-anchor="middle" font-size="9" fill="#333">Item Details</text>

  <!-- P1.2 → DS2 -->
  <line x1="430" y1="166" x2="430" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="440" y="204" font-size="9" fill="#333">Store Item</text>


  <!-- ================================================================
       MODULE 2: BIDDER MODULE   (top-right)
  ================================================================ -->
  <rect x="600" y="60" width="470" height="260" rx="12" fill="#fefce8" stroke="#ca8a04" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="835" y="84" text-anchor="middle" font-size="13" font-weight="bold" fill="#a16207">BIDDER MODULE</text>

  <!-- External: Bidder -->
  <rect x="618" y="110" width="90" height="44" rx="5" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="663" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#713f12">BIDDER</text>

  <!-- P2.1: View Items -->
  <ellipse cx="800" cy="132" rx="78" ry="34" fill="white" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="800" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">P2.1: View</text>
  <text x="800" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Items</text>

  <!-- P2.2: Place Bid -->
  <ellipse cx="980" cy="132" rx="78" ry="34" fill="white" stroke="#ca8a04" stroke-width="1.8"/>
  <text x="980" y="127" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">P2.2: Place</text>
  <text x="980" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#92400e">Bid</text>

  <!-- DS2: Items (bidder reads) -->
  <rect x="618" y="230" width="130" height="28" fill="white" stroke="#ca8a04" stroke-width="1.5"/>
  <line x1="618" y1="230" x2="618" y2="258" stroke="#ca8a04" stroke-width="2"/>
  <text x="683" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">DS2: Items</text>

  <!-- DS3: Bids -->
  <rect x="890" y="230" width="130" height="28" fill="white" stroke="#ca8a04" stroke-width="1.5"/>
  <line x1="890" y1="230" x2="890" y2="258" stroke="#ca8a04" stroke-width="2"/>
  <text x="955" y="248" text-anchor="middle" font-size="10" font-weight="bold" fill="#92400e">DS3: Bids</text>

  <!-- FLOWS: Bidder module -->
  <!-- Bidder → P2.1 -->
  <line x1="708" y1="132" x2="722" y2="132" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="714" y="124" text-anchor="middle" font-size="9" fill="#333">Browse</text>

  <!-- DS2 → P2.1 -->
  <line x1="748" y1="230" x2="770" y2="162" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="742" y="202" text-anchor="middle" font-size="9" fill="#333">Item List</text>

  <!-- P2.1 → Bidder -->
  <line x1="722" y1="145" x2="708" y2="150" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="716" y="160" text-anchor="middle" font-size="9" fill="#333">Items</text>

  <!-- P2.1 → P2.2 -->
  <line x1="878" y1="132" x2="902" y2="132" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="889" y="124" text-anchor="middle" font-size="9" fill="#333">Select Item</text>

  <!-- Bidder → P2.2 -->
  <line x1="708" y1="148" x2="800" y2="210" stroke="#333" stroke-width="1.5"/>
  <line x1="800" y1="210" x2="930" y2="162" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="770" y="225" text-anchor="middle" font-size="9" fill="#333">Bid Amount</text>

  <!-- P2.2 → DS3 -->
  <line x1="980" y1="166" x2="970" y2="230" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="992" y="204" font-size="9" fill="#333">Save Bid</text>


  <!-- ================================================================
       MODULE 3: ADMIN MODULE   (bottom-centre)
  ================================================================ -->
  <rect x="230" y="460" width="640" height="300" rx="12" fill="#fff1f2" stroke="#db2777" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="550" y="484" text-anchor="middle" font-size="13" font-weight="bold" fill="#be185d">ADMIN MODULE</text>

  <!-- External: Admin -->
  <rect x="252" y="510" width="90" height="44" rx="5" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="297" y="536" text-anchor="middle" font-size="11" font-weight="bold" fill="#831843">ADMIN</text>

  <!-- P3.1: View Auctions -->
  <ellipse cx="460" cy="532" rx="85" ry="34" fill="white" stroke="#db2777" stroke-width="1.8"/>
  <text x="460" y="527" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">P3.1: View</text>
  <text x="460" y="542" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">Auctions</text>

  <!-- P3.2: Determine Result -->
  <ellipse cx="660" cy="532" rx="85" ry="34" fill="white" stroke="#db2777" stroke-width="1.8"/>
  <text x="660" y="527" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">P3.2: Determine</text>
  <text x="660" y="542" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">Result</text>

  <!-- P3.3: Generate Commission -->
  <ellipse cx="800" cy="650" rx="85" ry="34" fill="white" stroke="#db2777" stroke-width="1.8"/>
  <text x="800" y="645" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">P3.3: Generate</text>
  <text x="800" y="660" text-anchor="middle" font-size="11" font-weight="bold" fill="#be185d">Commission</text>

  <!-- DS2: Items (admin reads) -->
  <rect x="252" y="650" width="130" height="28" fill="white" stroke="#db2777" stroke-width="1.5"/>
  <line x1="252" y1="650" x2="252" y2="678" stroke="#db2777" stroke-width="2"/>
  <text x="317" y="668" text-anchor="middle" font-size="10" font-weight="bold" fill="#be185d">DS2: Items</text>

  <!-- DS3: Bids (admin reads) -->
  <rect x="470" y="650" width="130" height="28" fill="white" stroke="#db2777" stroke-width="1.5"/>
  <line x1="470" y1="650" x2="470" y2="678" stroke="#db2777" stroke-width="2"/>
  <text x="535" y="668" text-anchor="middle" font-size="10" font-weight="bold" fill="#be185d">DS3: Bids</text>

  <!-- DS4: Commission -->
  <rect x="690" y="730" width="150" height="28" fill="white" stroke="#ea580c" stroke-width="1.5"/>
  <line x1="690" y1="730" x2="690" y2="758" stroke="#ea580c" stroke-width="2"/>
  <text x="765" y="748" text-anchor="middle" font-size="10" font-weight="bold" fill="#c2410c">DS4: Commission</text>

  <!-- FLOWS: Admin module -->
  <!-- Admin → P3.1 -->
  <line x1="342" y1="532" x2="375" y2="532" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="357" y="524" text-anchor="middle" font-size="9" fill="#333">Login</text>

  <!-- DS2 → P3.1 -->
  <line x1="382" y1="650" x2="420" y2="560" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="383" y="614" text-anchor="middle" font-size="9" fill="#333">Items</text>

  <!-- DS3 → P3.1 -->
  <line x1="535" y1="650" x2="492" y2="562" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="530" y="614" text-anchor="middle" font-size="9" fill="#333">Bids</text>

  <!-- P3.1 → P3.2 -->
  <line x1="545" y1="532" x2="575" y2="532" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="559" y="524" text-anchor="middle" font-size="9" fill="#333">Data</text>

  <!-- P3.2 → P3.3 -->
  <line x1="720" y1="550" x2="780" y2="620" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="772" y="588" font-size="9" fill="#333">Sale Amt</text>

  <!-- Admin → P3.3 -->
  <line x1="342" y1="548" x2="720" y2="650" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="530" y="615" text-anchor="middle" font-size="9" fill="#333">Trigger</text>

  <!-- P3.3 → DS4 -->
  <line x1="800" y1="684" x2="790" y2="730" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="818" y="712" font-size="9" fill="#c2410c">Save</text>


  <!-- ================================================================
       CROSS-MODULE SHARED DS LABELS (DS2 and DS3 shared)
  ================================================================ -->
  <!-- Connecting label: DS2 shared between Seller, Bidder, Admin -->
  <text x="550" y="400" text-anchor="middle" font-size="11" fill="#64748b" font-style="italic">DS2: Items and DS3: Bids are shared across modules (same Oracle tables)</text>

  <!-- ================================================================
       LEGEND
  ================================================================ -->
  <rect x="30" y="900" width="680" height="52" rx="4" fill="white" stroke="#aaa" stroke-width="1"/>
  <text x="48" y="920" font-size="11" font-weight="bold" fill="#111">Legend:</text>
  <ellipse cx="118" cy="916" rx="26" ry="12" fill="#f0f9ff" stroke="#0369a1"/>
  <text x="150" y="920" font-size="11" fill="#111">Process</text>
  <rect x="230" y="907" width="36" height="18" fill="#f0fdf4" stroke="#16a34a"/>
  <line x1="230" y1="907" x2="230" y2="925" stroke="#16a34a" stroke-width="2"/>
  <text x="272" y="920" font-size="11" fill="#111">Data Store</text>
  <rect x="380" y="907" width="36" height="18" fill="#dcfce7" stroke="#16a34a" rx="3"/>
  <text x="422" y="920" font-size="11" fill="#111">External Entity</text>
  <line x1="48" y1="940" x2="74" y2="940" stroke="#333" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="80" y="944" font-size="11" fill="#111">Data Flow</text>
  <rect x="230" y="930" width="130" height="18" rx="4" fill="none" stroke="#16a34a" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="295" y="943" text-anchor="middle" font-size="11" fill="#111">Module boundary</text>
</svg>
