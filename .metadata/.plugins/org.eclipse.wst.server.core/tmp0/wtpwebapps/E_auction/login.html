<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Auction</title>

    <link rel="stylesheet" href="login.css" />
  </head>

  <body>
    <header class="navbar">
      <div class="logo">E-<span>Auction</span></div>
      <div class="nav-buttons">
        <button
          type="button"
          class="btn login-btn"
          onclick="openModal('loginModal')"
        >
          Login
        </button>
        <button
          type="button"
          class="btn signup-btn"
          onclick="openModal('signupModal')"
        >
          Sign Up
        </button>
      </div>
    </header>

    <main class="hero">
      <div class="hero-content">
        <h1 class="hero-title">
          Bid Smart. <span class="orange-text">Win Big.</span>
        </h1>
        <p class="hero-description">
          Welcome to E-Auction, a secure and transparent online auction platform
          where buyers and sellers connect to discover, bid, and win amazing
          products.
        </p>
        <button
          type="button"
          class="register-btn"
          onclick="openModal('signupModal')"
        >
          Register Now
        </button>
      </div>
    </main>

    <div class="modal" id="loginModal">
      <div class="modal-content">
        <span class="close" onclick="closeModal('loginModal')">&times;</span>
        <h2>Login to <span>E-Auction</span></h2>

        <form action="LoginServlet" method="POST" id="loginForm" novalidate>
          <div class="modal-form-group">
            <label for="loginEmail">Email ID</label>
            <input
              type="email"
              id="loginEmail"
              name="EmailId"
              placeholder="Enter Email ID"
            />
            <div class="error-message" id="loginEmailError"></div>
          </div>

          <div class="modal-form-group">
            <label for="loginPassword">Password</label>
            <input
              type="password"
              id="loginPassword"
              name="Password"
              placeholder="Enter Password"
            />
            <div class="error-message" id="loginPasswordError"></div>
          </div>

          <button type="submit" class="modal-submit">Login</button>
        </form>
      </div>
    </div>

    <div class="modal" id="signupModal">
      <div class="modal-content">
        <span class="close" onclick="closeModal('signupModal')">&times;</span>
        <h2>Create <span>Account</span></h2>

        <form action="RegisterServlet" method="POST" id="signupForm" novalidate>
          <div class="section-heading">Personal Details</div>

          <div class="modal-form-group">
            <label for="signupName">Name</label>
            <input
              type="text"
              id="signupName"
              name="name"
              placeholder="Enter full name"
            />
            <div class="error-message" id="signupNameError"></div>
          </div>

          <div class="modal-form-group">
            <label for="signupEmail">Email ID</label>
            <input
              type="email"
              id="signupEmail"
              name="email"
              placeholder="Enter email"
            />
            <div class="error-message" id="signupEmailError"></div>
          </div>

          <div class="modal-form-group">
            <label for="signupPassword">Password</label>
            <input
              type="password"
              id="signupPassword"
              name="password"
              placeholder="Create password"
            />
            <div class="error-message" id="signupPasswordError"></div>
          </div>

          <div class="modal-form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter password"
            />
            <div class="error-message" id="confirmPasswordError"></div>
          </div>

          <div class="modal-form-group">
            <label for="signupPhone">Phone Number</label>
            <input
              type="tel"
              id="signupPhone"
              name="mobile"
              placeholder="Enter 10 digit phone number"
              maxlength="10"
              inputmode="numeric"
            />
            <div class="error-message" id="signupPhoneError"></div>
          </div>

          <div class="modal-form-group">
            <label for="signupAddress">Address</label>
            <textarea
              id="signupAddress"
              name="address"
              rows="2"
              placeholder="Enter address"
            ></textarea>
            <div class="error-message" id="signupAddressError"></div>
          </div>

          <div class="modal-form-group">
            <label for="signupGender">Gender</label>
            <select id="signupGender" name="gender">
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
            <div class="error-message" id="signupGenderError"></div>
          </div>

          <div class="section-heading">Bank Details</div>

          <div class="modal-form-group">
            <label for="bankAccountHolder">Account Holder Name</label>
            <input
              type="text"
              id="bankAccountHolder"
              name="Account Holder Name"
              placeholder="Enter account holder name"
            />
            <div class="error-message" id="bankAccountHolderError"></div>
          </div>

          <div class="modal-form-group">
            <label for="bankName">Bank Name</label>
            <input
              type="text"
              id="bankName"
              name="Bank Name"
              placeholder="Enter bank name"
            />
            <div class="error-message" id="bankNameError"></div>
          </div>

          <div class="modal-form-group">
            <label for="bankAccNumber">Account Number</label>
            <input
              type="text"
              id="bankAccNumber"
              name="Account Number"
              placeholder="Enter account number"
              inputmode="numeric"
            />
            <div class="error-message" id="bankAccNumberError"></div>
          </div>

          <div class="modal-form-group">
            <label for="bankIFSC">IFSC Code</label>
            <input
              type="text"
              id="bankIFSC"
              name="IFSC Code"
              placeholder="Enter IFSC code"
              maxlength="11"
            />
            <div class="error-message" id="bankIFSCError"></div>
          </div>

          <div class="modal-form-group">
            <label for="bankBranch">Branch</label>
            <input
              type="text"
              id="bankBranch"
              name="Branch"
              placeholder="Enter branch name"
            />
            <div class="error-message" id="bankBranchError"></div>
          </div>

          <button type="submit" class="modal-submit">Sign Up</button>
        </form>
      </div>
    </div>

    <footer>© 2026 E-Auction. All Rights Reserved.</footer>

    <script src="login.js"></script>
  </body>
</html>
