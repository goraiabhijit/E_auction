<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – E-Auction</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:#eef5ff; --top:#d9e8ff; --side:#fff; --panel:#fff; --ink:#0c2250; --muted:#5d79ab;
      --line:#9bbdf2; --line2:#dce8fb; --accent:#2563eb; --on:#fff; --head:#e4efff; --banner:#cfe2ff;
      --s1:#ffd966; --good:#0d8a4e; --bad:#d3303b; --info:#2563eb; --link:#2563eb;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:'Manrope','Segoe UI',system-ui,sans-serif; }
    *:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

    body { background:var(--bg); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; font-family:'Manrope','Segoe UI',system-ui,sans-serif; }

    .navbar { height:auto; background:var(--top); display:flex; align-items:center; justify-content:space-between; padding:14px 7%; border-bottom:1.5px solid var(--line); position:sticky; top:0; z-index:100; }
    .logo { font-size:25px; font-weight:800; color:var(--accent); text-decoration:none; letter-spacing:-.5px; }
    .logo span { color:var(--ink); }
    .nav-link { font-size:14px; color:var(--muted); font-weight:500; }
    .nav-link a { color:var(--link); text-decoration:none; font-weight:700; }
    .nav-link a:hover { text-decoration:underline; }

    .page { flex:1; display:flex; align-items:center; justify-content:center; padding:40px 20px; }

    .card { background:var(--panel); color:var(--ink); width:100%; max-width:440px; padding:36px 32px; border-radius:10px; border:1.5px solid var(--line); border-top:6px solid var(--accent); }
    .card h2 { font-size:24px; margin-bottom:24px; font-weight:800; color:var(--ink); }
    .card h2 span { color:var(--accent); }

    .tabs { display:flex; border-bottom:1.5px solid var(--line2); margin-bottom:24px; }
    .tab-btn { flex:1; padding:10px; background:none; border:none; border-bottom:3px solid transparent; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer; margin-bottom:-2px; transition:color 0.15s,border-color 0.15s; border-radius:0; margin-top:0; width:auto; }
    .tab-btn:hover { color:var(--ink); background:none; }
    .tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); }

    .tab-panel { display:none; }
    .tab-panel.active { display:block; }

    label { display:block; font-size:11px; font-weight:800; color:var(--muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.12em; }

    input { width:100%; padding:11px 14px; border:1.5px solid var(--line); border-radius:8px; font-size:14px; outline:none; margin-bottom:4px; color:var(--ink); background:#fff; transition:border-color 0.2s; font-family:inherit; }
    input:focus { border-color:var(--accent); }
    input.error { border-color:var(--bad); }

    .err { color:var(--bad); font-size:12px; margin-bottom:12px; display:none; font-weight:600; }

    button { width:100%; padding:12px; background:var(--accent); color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:700; cursor:pointer; margin-top:8px; transition:opacity 0.15s; font-family:inherit; }
    button:hover { opacity:0.85; color:#fff; }

    .card-footer { text-align:center; margin-top:16px; font-size:14px; color:var(--muted); }
    .card-footer a { color:var(--link); text-decoration:none; font-weight:700; }
    .card-footer a:hover { text-decoration:underline; }

    .banner { padding:10px 14px; border-radius:8px; font-size:13px; margin-bottom:18px; display:none; border:1.5px solid; font-weight:600; }
    .banner.success { background:rgba(13,138,78,0.08); color:var(--good); border-color:var(--good); }
    .banner.error   { background:rgba(211,48,59,0.08); color:var(--bad); border-color:var(--bad); }

    footer { background:var(--top); padding:20px 7%; text-align:center; color:var(--muted); font-size:13px; border-top:1.5px solid var(--line); }
  </style>
</head>
<body>

  <header class="navbar">
    <a class="logo" href="index.html">E-<span>Auction</span></a>
    <span class="nav-link">No account? <a href="signup.html">Sign Up</a></span>
  </header>

  <main class="page">
    <div class="card">
      <h2>Login to <span>E-Auction</span></h2>

      <div id="banner" class="banner"></div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('user')">User Login</button>
        <button class="tab-btn"        onclick="switchTab('admin')">Admin Login</button>
      </div>

      <!-- User Login -->
      <div class="tab-panel active" id="tab-user">
        <form action="LoginServlet" method="POST" id="loginForm" novalidate>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" />
          <div class="err" id="emailErr"></div>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
          <div class="err" id="passwordErr"></div>

          <button type="submit">Login</button>
        </form>
      </div>

      <!-- Admin Login -->
      <div class="tab-panel" id="tab-admin">
        <form action="AdminLoginServlet" method="POST" id="adminForm" novalidate>
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" name="email" placeholder="Enter admin email" autocomplete="email" />
          <div class="err" id="adminEmailErr"></div>

          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" name="password" placeholder="Enter admin password" autocomplete="current-password" />
          <div class="err" id="adminPasswordErr"></div>

          <button type="submit">Login as Admin</button>
        </form>
      </div>

      <div class="card-footer">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </main>

  <footer>© 2026 E-Auction. All Rights Reserved.</footer>

  <script>
    // ── Tab switcher ──
    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(function(btn, i) {
        btn.classList.toggle("active", (tab === "user" && i === 0) || (tab === "admin" && i === 1));
      });
      document.getElementById("tab-user").classList.toggle("active",  tab === "user");
      document.getElementById("tab-admin").classList.toggle("active", tab === "admin");
    }

    // ── Banner from query param ──
    const params = new URLSearchParams(window.location.search);
    const banner = document.getElementById("banner");
    if (params.get("status") === "registered") {
      banner.textContent = "Account created! Please sign in.";
      banner.classList.add("success");
      banner.style.display = "block";
    }
    if (params.get("error") === "invalid") {
      banner.textContent = "Invalid email or password.";
      banner.classList.add("error");
      banner.style.display = "block";
    }
    if (params.get("error") === "invalid_admin") {
      banner.textContent = "Invalid admin credentials.";
      banner.classList.add("error");
      banner.style.display = "block";
      switchTab("admin");
    }

    // ── Validation helpers ──
    function showErr(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = "block";
    }
    function clearErr(id) {
      const el = document.getElementById(id);
      el.textContent = "";
      el.style.display = "none";
    }

    function validateForm(emailId, emailErrId, passwordId, passwordErrId) {
      const email    = document.getElementById(emailId);
      const password = document.getElementById(passwordId);
      let valid = true;

      if (!email.value.trim()) {
        showErr(emailErrId, "Email cannot be blank.");
        email.classList.add("error");
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
        showErr(emailErrId, "Enter a valid email address.");
        email.classList.add("error");
        valid = false;
      } else {
        clearErr(emailErrId);
        email.classList.remove("error");
      }

      if (!password.value) {
        showErr(passwordErrId, "Password cannot be blank.");
        password.classList.add("error");
        valid = false;
      } else {
        clearErr(passwordErrId);
        password.classList.remove("error");
      }

      return valid;
    }

    // User form validation
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      if (validateForm("email", "emailErr", "password", "passwordErr")) this.submit();
    });

    // Admin form validation
    document.getElementById("adminForm").addEventListener("submit", function(e) {
      e.preventDefault();
      if (validateForm("adminEmail", "adminEmailErr", "adminPassword", "adminPasswordErr")) this.submit();
    });
  </script>

</body>
</html>
