<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In – E-Auction</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }

    body {
      background: #101827;
      color: white;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .navbar {
      height: 84px;
      background: #101827;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 7%;
      border-top: 3px solid #f59e0b;
      box-shadow: 0 3px 12px rgba(0,0,0,0.25);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo { font-size: 28px; font-weight: bold; color: white; text-decoration: none; }
    .logo span { color: #f59e0b; }

    .nav-link { font-size: 14px; color: #9ca3af; }
    .nav-link a { color: #f59e0b; text-decoration: none; font-weight: bold; }
    .nav-link a:hover { text-decoration: underline; }

    .page {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      background: white;
      color: #111827;
      width: 100%;
      max-width: 440px;
      padding: 36px 32px;
      border-radius: 12px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.4);
    }

    .card h2 { font-size: 24px; margin-bottom: 24px; }
    .card h2 span { color: #f59e0b; }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      border-bottom: 2px solid #e2e8f0;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 14px;
      font-weight: bold;
      color: #94a3b8;
      cursor: pointer;
      margin-bottom: -2px;
      transition: color 0.2s, border-color 0.2s;
      border-radius: 0;
      margin-top: 0;
      width: auto;
    }

    .tab-btn:hover { background: none; color: #374151; }

    .tab-btn.active {
      color: #f59e0b;
      border-bottom-color: #f59e0b;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      color: #334155;
      margin-bottom: 4px;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      margin-bottom: 4px;
    }

    input:focus { border-color: #f59e0b; box-shadow: 0 0 0 2px rgba(245,158,11,0.15); }
    input.error { border-color: #dc2626; }

    .err { color: #dc2626; font-size: 12px; margin-bottom: 12px; display: none; }

    button {
      width: 100%;
      padding: 12px;
      background: #f59e0b;
      color: #111827;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.2s;
    }

    button:hover { background: #d97706; color: white; }

    .card-footer { text-align: center; margin-top: 16px; font-size: 14px; color: #64748b; }
    .card-footer a { color: #f59e0b; text-decoration: none; font-weight: bold; }
    .card-footer a:hover { text-decoration: underline; }

    .banner { padding: 10px 14px; border-radius: 6px; font-size: 13px; margin-bottom: 18px; display: none; }
    .banner.success { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
    .banner.error   { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }

    footer { background: #030712; padding: 20px 7%; text-align: center; color: #9ca3af; font-size: 13px; }
  </style>
</head>
<body>

  <header class="navbar">
    <a class="logo" href="index.html">E-<span>Auction</span></a>
    <span class="nav-link">No account? <a href="signup.html">Sign Up</a></span>
  </header>

  <main class="page">
    <div class="card">
      <h2>Login to <span>E-Auction</span></h2>

      <div id="banner" class="banner"></div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('user')">User Login</button>
        <button class="tab-btn"        onclick="switchTab('admin')">Admin Login</button>
      </div>

      <!-- User Login -->
      <div class="tab-panel active" id="tab-user">
        <form action="LoginServlet" method="POST" id="loginForm" novalidate>
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" autocomplete="email" />
          <div class="err" id="emailErr"></div>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" />
          <div class="err" id="passwordErr"></div>

          <button type="submit">Login</button>
        </form>
      </div>

      <!-- Admin Login -->
      <div class="tab-panel" id="tab-admin">
        <form action="AdminLoginServlet" method="POST" id="adminForm" novalidate>
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" name="email" placeholder="Enter admin email" autocomplete="email" />
          <div class="err" id="adminEmailErr"></div>

          <label for="adminPassword">Password</label>
          <input type="password" id="adminPassword" name="password" placeholder="Enter admin password" autocomplete="current-password" />
          <div class="err" id="adminPasswordErr"></div>

          <button type="submit">Login as Admin</button>
        </form>
      </div>

      <div class="card-footer">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </main>

  <footer>© 2026 E-Auction. All Rights Reserved.</footer>

  <script>
    // ── Tab switcher ──
    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(function(btn, i) {
        btn.classList.toggle("active", (tab === "user" && i === 0) || (tab === "admin" && i === 1));
      });
      document.getElementById("tab-user").classList.toggle("active",  tab === "user");
      document.getElementById("tab-admin").classList.toggle("active", tab === "admin");
    }

    // ── Banner from query param ──
    const params = new URLSearchParams(window.location.search);
    const banner = document.getElementById("banner");
    if (params.get("status") === "registered") {
      banner.textContent = "Account created! Please sign in.";
      banner.classList.add("success");
      banner.style.display = "block";
    }
    if (params.get("error") === "invalid") {
      banner.textContent = "Invalid email or password.";
      banner.classList.add("error");
      banner.style.display = "block";
    }
    if (params.get("error") === "invalid_admin") {
      banner.textContent = "Invalid admin credentials.";
      banner.classList.add("error");
      banner.style.display = "block";
      switchTab("admin");
    }

    // ── Validation helpers ──
    function showErr(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.style.display = "block";
    }
    function clearErr(id) {
      const el = document.getElementById(id);
      el.textContent = "";
      el.style.display = "none";
    }

    function validateForm(emailId, emailErrId, passwordId, passwordErrId) {
      const email    = document.getElementById(emailId);
      const password = document.getElementById(passwordId);
      let valid = true;

      if (!email.value.trim()) {
        showErr(emailErrId, "Email cannot be blank.");
        email.classList.add("error");
        valid = false;
      } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
        showErr(emailErrId, "Enter a valid email address.");
        email.classList.add("error");
        valid = false;
      } else {
        clearErr(emailErrId);
        email.classList.remove("error");
      }

      if (!password.value) {
        showErr(passwordErrId, "Password cannot be blank.");
        password.classList.add("error");
        valid = false;
      } else {
        clearErr(passwordErrId);
        password.classList.remove("error");
      }

      return valid;
    }

    // User form validation
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      if (validateForm("email", "emailErr", "password", "passwordErr")) this.submit();
    });

    // Admin form validation
    document.getElementById("adminForm").addEventListener("submit", function(e) {
      e.preventDefault();
      if (validateForm("adminEmail", "adminEmailErr", "adminPassword", "adminPasswordErr")) this.submit();
    });
  </script>

</body>
</html>
