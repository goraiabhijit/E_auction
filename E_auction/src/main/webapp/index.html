<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Auction</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg:#eef5ff; --top:#d9e8ff; --side:#fff; --panel:#fff; --ink:#0c2250; --muted:#5d79ab;
        --line:#9bbdf2; --line2:#dce8fb; --accent:#2563eb; --on:#fff; --head:#e4efff; --banner:#cfe2ff;
        --s1:#ffd966; --good:#0d8a4e; --bad:#d3303b; --info:#2563eb; --link:#2563eb;
      }
      *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:'Manrope','Segoe UI',system-ui,sans-serif; }
      *:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

      body { background:var(--bg); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; font-family:'Manrope','Segoe UI',system-ui,sans-serif; }

      .navbar { height:auto; width:100%; background:var(--top); display:flex; align-items:center; justify-content:space-between; padding:14px 7%; border-bottom:1.5px solid var(--line); position:sticky; top:0; z-index:1000; }

      .logo { font-size:30px; font-weight:800; color:var(--accent); letter-spacing:-1px; text-decoration:none; }
      .logo span { color:var(--ink); }

      .nav-buttons { display:flex; gap:10px; }

      .btn { padding:9px 20px; border-radius:8px; font-size:14px; font-weight:700; cursor:pointer; transition:0.2s; text-decoration:none; display:inline-block; }

      .login-btn { background:#fff; color:var(--accent); border:1.5px solid var(--accent); }
      .login-btn:hover { background:var(--accent); color:#fff; }

      .signup-btn { background:var(--accent); color:#fff; border:1.5px solid var(--accent); }
      .signup-btn:hover { opacity:0.85; }

      .register-btn { background:var(--accent); color:#fff; border:none; padding:14px 32px; border-radius:8px; font-size:16px; font-weight:800; cursor:pointer; transition:0.2s; text-decoration:none; display:inline-block; }
      .register-btn:hover { opacity:0.85; }

      .hero { flex:1; display:flex; align-items:center; padding:80px 7%; background:var(--bg); }
      .hero-content { max-width:850px; }

      .hero-title { font-size:62px; line-height:1.1; font-weight:800; margin-bottom:28px; color:var(--ink); letter-spacing:-.03em; }
      .orange-text { color:var(--accent); }
      .hero-description { max-width:780px; font-size:19px; line-height:1.8; color:var(--muted); margin-bottom:35px; }

      footer { background:var(--top); padding:25px 7%; text-align:center; color:var(--muted); font-size:14px; border-top:1.5px solid var(--line); }

      @media (max-width:650px) {
        .navbar { padding:12px 20px; flex-wrap:wrap; gap:10px; }
        .logo { font-size:24px; }
        .hero-title { font-size:42px; }
        .hero-description { font-size:16px; }
      }
    </style>
  </head>

  <body>
    <header class="navbar">
      <a class="logo" href="index.html">E-<span>Auction</span></a>
      <div class="nav-buttons">
        <a class="btn login-btn" href="signin.html">Login</a>
        <a class="btn signup-btn" href="signup.html">Sign Up</a>
      </div>
    </header>

    <main class="hero">
      <div class="hero-content">
        <h1 class="hero-title">
          Bid Smart. <span class="orange-text">Win Big.</span>
        </h1>
        <p class="hero-description">
          Welcome to E-Auction, a secure and transparent online auction platform
          where buyers and sellers connect to discover, bid, and win amazing
          products.
        </p>
        <a class="register-btn" href="signup.html">Register Now</a>
      </div>
    </main>

    <footer>© 2026 E-Auction. All Rights Reserved.</footer>
  </body>
</html>
