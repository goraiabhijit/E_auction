<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up – E-Auction</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg:#eef5ff; --top:#d9e8ff; --side:#fff; --panel:#fff; --ink:#0c2250; --muted:#5d79ab;
        --line:#9bbdf2; --line2:#dce8fb; --accent:#2563eb; --on:#fff; --head:#e4efff; --banner:#cfe2ff;
        --s1:#ffd966; --good:#0d8a4e; --bad:#d3303b; --info:#2563eb; --link:#2563eb;
      }
      *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; font-family:'Manrope','Segoe UI',system-ui,sans-serif; }
      *:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }

      body { background:var(--bg); color:var(--ink); min-height:100vh; display:flex; flex-direction:column; font-family:'Manrope','Segoe UI',system-ui,sans-serif; }

      /* ── Navbar ── */
      .navbar { height:auto; width:100%; background:var(--top); display:flex; align-items:center; justify-content:space-between; padding:14px 7%; border-bottom:1.5px solid var(--line); position:sticky; top:0; z-index:1000; }

      .logo { font-size:30px; font-weight:800; color:var(--accent); letter-spacing:-1px; text-decoration:none; }
      .logo span { color:var(--ink); }

      .nav-link { font-size:14px; color:var(--muted); font-weight:500; }
      .nav-link a { color:var(--link); text-decoration:none; font-weight:700; }
      .nav-link a:hover { text-decoration:underline; }

      /* ── Page layout ── */
      .page { flex:1; display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; background:var(--bg); }

      /* ── Card ── */
      .card { background:var(--panel); color:var(--ink); width:100%; max-width:520px; padding:36px 32px; border-radius:10px; border:1.5px solid var(--line); border-top:6px solid var(--accent); animation:cardIn 0.25s ease; }

      @keyframes cardIn {
        from { transform:translateY(20px); opacity:0; }
        to   { transform:translateY(0);    opacity:1; }
      }

      .card h2 { font-size:26px; margin-bottom:10px; color:var(--ink); font-weight:800; }
      .card h2 span { color:var(--accent); }

      .section-heading { font-size:11px; text-transform:uppercase; letter-spacing:.18em; color:var(--accent); font-weight:800; margin:18px 0 10px; border-bottom:1.5px solid var(--line2); padding-bottom:4px; }

      /* ── Form ── */
      .form-group { margin-bottom:12px; }
      .form-group label { display:block; margin-bottom:4px; font-weight:800; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.12em; }
      .form-group input, .form-group select, .form-group textarea { width:100%; padding:10px 14px; border:1.5px solid var(--line); border-radius:8px; font-size:14px; outline:none; transition:border-color 0.2s; color:var(--ink); background:#fff; font-family:inherit; }
      .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--accent); }

      .error-message { color:var(--bad); font-size:12px; margin-top:4px; display:none; font-weight:600; }
      .input-error   { border:1.5px solid var(--bad) !important; }
      .input-success { border:1.5px solid var(--good) !important; }

      .submit-btn { width:100%; padding:12px; border:none; border-radius:8px; background:var(--accent); color:#fff; font-size:16px; font-weight:800; cursor:pointer; margin-top:15px; transition:opacity 0.3s; font-family:inherit; }
      .submit-btn:hover { opacity:0.85; color:#fff; }

      .card-footer { margin-top:18px; text-align:center; font-size:14px; color:var(--muted); }
      .card-footer a { color:var(--link); text-decoration:none; font-weight:700; }
      .card-footer a:hover { text-decoration:underline; }

      /* ── Footer ── */
      footer { background:var(--top); padding:22px 7%; text-align:center; color:var(--muted); font-size:14px; border-top:1.5px solid var(--line); }

      @media (max-width:560px) {
        .navbar { padding:12px 20px; flex-wrap:wrap; gap:10px; }
        .logo { font-size:24px; }
        .card { padding:26px 18px; }
      }
    </style>
  </head>

  <body>
    <header class="navbar">
      <a class="logo" href="index.html">E-<span>Auction</span></a>
      <span class="nav-link">
        Already have an account? <a href="signin.html">Sign In</a>
      </span>
    </header>

    <main class="page">
      <div class="card">
        <h2>Create <span>Account</span></h2>

        <form action="RegisterServlet" method="POST" id="signupForm" novalidate>

          <div class="section-heading">Personal Details</div>

          <div class="form-group">
            <label for="signupName">Name</label>
            <input
              type="text"
              id="signupName"
              name="name"
              placeholder="Enter full name"
              autocomplete="name"
            />
            <div class="error-message" id="signupNameError"></div>
          </div>

          <div class="form-group">
            <label for="signupEmail">Email ID</label>
            <input
              type="email"
              id="signupEmail"
              name="email"
              placeholder="Enter email"
              autocomplete="email"
            />
            <div class="error-message" id="signupEmailError"></div>
          </div>

          <div class="form-group">
            <label for="signupPassword">Password</label>
            <input
              type="password"
              id="signupPassword"
              name="password"
              placeholder="Create password"
              autocomplete="new-password"
            />
            <div class="error-message" id="signupPasswordError"></div>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Re-enter password"
              autocomplete="new-password"
            />
            <div class="error-message" id="confirmPasswordError"></div>
          </div>

          <div class="form-group">
            <label for="signupPhone">Phone Number</label>
            <input
              type="tel"
              id="signupPhone"
              name="mobile"
              placeholder="Enter 10 digit phone number"
              maxlength="10"
              inputmode="numeric"
              autocomplete="tel"
            />
            <div class="error-message" id="signupPhoneError"></div>
          </div>

          <div class="form-group">
            <label for="signupAddress">Address</label>
            <textarea
              id="signupAddress"
              name="address"
              rows="2"
              placeholder="Enter address"
              autocomplete="street-address"
            ></textarea>
            <div class="error-message" id="signupAddressError"></div>
          </div>

          <div class="form-group">
            <label for="signupGender">Gender</label>
            <select id="signupGender" name="gender">
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
            <div class="error-message" id="signupGenderError"></div>
          </div>

          <button type="submit" class="submit-btn">Sign Up</button>
        </form>

        <div class="card-footer">
          Already have an account? <a href="signin.html">Sign In</a>
        </div>
      </div>
    </main>

    <footer>© 2026 E-Auction. All Rights Reserved.</footer>

    <script>
      /* ── Validation helpers ── */
      
      
      
      function error(input, message) {
        if (!input) return false;
        input.classList.remove("input-success");
        input.classList.add("input-error");

        const e = document.getElementById(input.id + "Error");
        if (e) {
          e.textContent = message;
          e.style.display = "block";
        }

        return false;
      }

      function success(input) {
        if (!input) return true;
        input.classList.remove("input-error");
        input.classList.add("input-success");

        const e = document.getElementById(input.id + "Error");
        if (e) {
          e.textContent = "";
          e.style.display = "none";
        }

        return true;
      }

      function validateName(input) {
        if (!input || input.value.trim() === "") {
          return error(input, "Name cannot be blank.");
        }
        return success(input);
      }

      function validateEmail(input) {
        if (!input || input.value.trim() === "") {
          return error(input, "Email ID cannot be blank.");
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(input.value.trim())) {
          return error(input, "Enter a valid email ID.");
        }
        return success(input);
      }

      function validatePassword(input) {
        if (!input || input.value === "") {
          return error(input, "Password cannot be blank.");
        }
        return success(input);
      }

      function validateConfirmPassword(input) {
        const passInput = document.getElementById("signupPassword");
        const password = passInput ? passInput.value : "";

        if (!input || input.value === "") {
          return error(input, "Confirm password cannot be blank.");
        }
        if (input.value !== password) {
          return error(input, "Passwords do not match.");
        }
        return success(input);
      }

      function validatePhone(input) {
        if (!input) return false;
        input.value = input.value.replace(/[^0-9]/g, "");

        if (input.value === "") {
          return error(input, "Mobile number cannot be blank.");
        }
        if (input.value.length !== 10) {
          return error(input, "Mobile number must be exactly 10 digits.");
        }
        return success(input);
      }

      function validateBlank(input, fieldName) {
        if (!input || input.value.trim() === "") {
          return error(input, fieldName + " cannot be blank.");
        }
        return success(input);
      }

      /* ── Live listeners ── */
      const signupName = document.getElementById("signupName");
      if (signupName) signupName.addEventListener("input", function () { validateName(this); });

      const signupEmail = document.getElementById("signupEmail");
      if (signupEmail) signupEmail.addEventListener("input", function () { validateEmail(this); });

      const signupPassword = document.getElementById("signupPassword");
      if (signupPassword) {
        signupPassword.addEventListener("input", function () {
          validatePassword(this);
          const confirm = document.getElementById("confirmPassword");
          if (confirm && confirm.value !== "") validateConfirmPassword(confirm);
        });
      }

      const confirmPassword = document.getElementById("confirmPassword");
      if (confirmPassword) confirmPassword.addEventListener("input", function () { validateConfirmPassword(this); });

      const signupPhone = document.getElementById("signupPhone");
      if (signupPhone) signupPhone.addEventListener("input", function () { validatePhone(this); });

      const signupAddress = document.getElementById("signupAddress");
      if (signupAddress) signupAddress.addEventListener("input", function () { validateBlank(this, "Address"); });

      const signupGender = document.getElementById("signupGender");
      if (signupGender) {
        signupGender.addEventListener("change", function () {
          if (this.value === "") error(this, "Please select your gender.");
          else success(this);
        });
      }

      /* ── Submit handler ── */
      const signupForm = document.getElementById("signupForm");
      if (signupForm) {
        signupForm.addEventListener("submit", function (event) {
          event.preventDefault();

          const name     = document.getElementById("signupName");
          const email    = document.getElementById("signupEmail");
          const password = document.getElementById("signupPassword");
          const confirm  = document.getElementById("confirmPassword");
          const phone    = document.getElementById("signupPhone");
          const address  = document.getElementById("signupAddress");
          const gender   = document.getElementById("signupGender");

          validateName(name);
          validateEmail(email);
          validatePassword(password);
          validateConfirmPassword(confirm);
          validatePhone(phone);
          validateBlank(address, "Address");

          if (gender && gender.value === "") error(gender, "Please select your gender.");
          else success(gender);

          const firstError = this.querySelector(".input-error");
          if (firstError) { firstError.focus(); return; }

          this.submit();
        });

        window.addEventListener("DOMContentLoaded", function () {
            const urlParams = new URLSearchParams(window.location.search);
            const errorParam = urlParams.get("error");

            if (errorParam === "exists") {
              const emailInput = document.getElementById("signupEmail");
              // Reuses your existing error() function to highlight the input in red!
              error(emailInput, "An account with this email already exists!");
            } else if (errorParam === "failed") {
              alert("Registration failed due to a server error. Please try again.");
            }
          });
        
        /* ── Keyboard navigation ── */
        const fields = Array.from(signupForm.querySelectorAll("input, select, textarea"));
        fields.forEach(function (field, index) {
          field.addEventListener("keydown", function (event) {
            if (event.key === "Enter" && field.tagName !== "TEXTAREA") {
              event.preventDefault();
              if (field.classList.contains("input-error")) { field.focus(); return; }
              if (index < fields.length - 1) fields[index + 1].focus();
            }
          });
        });
      }
    </script>
  </body>
</html>
